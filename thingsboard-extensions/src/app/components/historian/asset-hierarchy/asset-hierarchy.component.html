<div class="historian-hierarchy-panel">
  <ng-container *ngIf="widgetTitlePanel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </ng-container>

  <div class="historian-hierarchy-search">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput
             placeholder="Search..."
             [(ngModel)]="searchText"
             (ngModelChange)="onSearchChange()">
      <button *ngIf="searchText" matSuffix mat-icon-button (click)="searchText = ''; onSearchChange()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="historian-hierarchy-tree">
    <div *ngFor="let node of filteredDataSource"
         class="tree-node"
         [class.selected]="node.id === selectedNodeId"
         [style.paddingLeft.px]="node.level * 24 + 8">

      <button class="expand-btn"
              *ngIf="node.expandable"
              (click)="toggleNode(node); $event.stopPropagation()">
        <mat-icon *ngIf="!node.loading">
          {{ isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
        <mat-spinner *ngIf="node.loading" diameter="18"></mat-spinner>
      </button>
      <span *ngIf="!node.expandable" class="expand-spacer"></span>

      <mat-icon class="node-icon" [class]="node.entityType.toLowerCase()">
        {{ getIcon(node) }}
      </mat-icon>

      <span class="node-label" (click)="selectNode(node)">
        {{ node.name }}
      </span>

      <span *ngIf="node.tagCount !== undefined" class="tag-count">
        ({{ node.tagCount }})
      </span>
    </div>

    <div *ngIf="filteredDataSource.length === 0" class="empty-state">
      <mat-icon>account_tree</mat-icon>
      <span>No nodes found</span>
    </div>
  </div>
</div>
