<div class="historian-batch-panel">
  <ng-container *ngIf="widgetTitlePanel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </ng-container>

  <div class="batch-toolbar">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Event Type</mat-label>
      <mat-select [(value)]="filterType" (selectionChange)="onFilterChange()">
        <mat-option *ngFor="let t of eventTypes" [value]="t">{{ t || 'All' }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Severity</mat-label>
      <mat-select [(value)]="filterSeverity" (selectionChange)="onFilterChange()">
        <mat-option *ngFor="let s of severities" [value]="s">{{ s || 'All' }}</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-icon-button (click)="refresh()" matTooltip="Refresh">
      <mat-icon>refresh</mat-icon>
    </button>

    <span class="event-count">{{ filteredEvents.length }} events</span>
  </div>

  <div class="batch-gantt-area">
    <div #ganttChart class="gantt-echart-container"></div>
  </div>

  <div class="batch-table-area">
    <table class="batch-table">
      <thead>
        <tr>
          <th>Event</th>
          <th>Severity</th>
          <th>Start</th>
          <th>End</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of filteredEvents">
          <td>{{ e.name }}</td>
          <td [class]="getSeverityClass(e.severity)">{{ e.severity }}</td>
          <td class="ts-col">{{ formatTime(e.startTs) }}</td>
          <td class="ts-col">{{ formatTime(e.endTs) }}</td>
          <td>{{ formatDuration(e.duration) }}</td>
          <td>{{ e.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
