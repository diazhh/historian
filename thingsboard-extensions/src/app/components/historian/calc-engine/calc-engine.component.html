<div class="historian-calc-engine-panel">
  <ng-container *ngIf="widgetTitlePanel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </ng-container>

  <div class="calc-toolbar">
    <button mat-raised-button color="primary" (click)="toggleAddForm()">
      <mat-icon>add</mat-icon> Add Field
    </button>
    <span class="spacer"></span>
    <button mat-icon-button (click)="refresh()" title="Refresh">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <div *ngIf="showAddForm" class="add-form">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="newField.name">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Output Key</mat-label>
      <input matInput [(ngModel)]="newField.outputKey" placeholder="CALC.xxx">
    </mat-form-field>
    <mat-form-field appearance="outline" class="expression-field">
      <mat-label>Expression</mat-label>
      <textarea matInput [(ngModel)]="newField.expression" rows="2"
                placeholder="$['TI-101.PV'] - $['TI-102.PV']"></textarea>
    </mat-form-field>
    <div class="add-form-actions">
      <button mat-button (click)="toggleAddForm()">Cancel</button>
      <button mat-raised-button color="primary" (click)="addField()"
              [disabled]="!newField.name || !newField.expression || !newField.outputKey">
        Create
      </button>
    </div>
  </div>

  <div class="calc-list" *ngIf="!loading">
    <div *ngFor="let field of fields" class="calc-card" [class.disabled]="!field.enabled">
      <div class="calc-card-header">
        <mat-icon class="calc-icon">functions</mat-icon>
        <div class="calc-info">
          <span class="calc-name">{{ field.name }}</span>
          <span class="calc-output">{{ field.outputKey }}</span>
        </div>
        <span class="spacer"></span>
        <span *ngIf="field.lastValue !== null && field.lastValue !== undefined" class="calc-value">
          {{ field.lastValue }}
        </span>
        <mat-slide-toggle [checked]="field.enabled" (change)="field.enabled = $event.checked"></mat-slide-toggle>
        <button mat-icon-button (click)="toggleEdit(field)">
          <mat-icon>{{ field.editing ? 'close' : 'edit' }}</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteField(field)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>

      <div *ngIf="!field.editing" class="calc-expression-preview">
        <code>{{ field.expression }}</code>
      </div>

      <div *ngIf="field.editing" class="calc-edit-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Expression</mat-label>
          <textarea matInput [(ngModel)]="field.expression" rows="3"></textarea>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="saveField(field)">Save</button>
      </div>
    </div>

    <div *ngIf="fields.length === 0" class="empty-state">
      <mat-icon>functions</mat-icon>
      <span>No calculated fields configured</span>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
</div>
