<div class="historian-data-grid-panel">
  <ng-container *ngIf="widgetTitlePanel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </ng-container>

  <div class="grid-toolbar">
    <mat-form-field appearance="outline" class="interval-select">
      <mat-label>Interval</mat-label>
      <mat-select [(value)]="selectedInterval" (selectionChange)="onIntervalChange()">
        <mat-option *ngFor="let opt of intervalOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <span class="spacer"></span>

    <button mat-icon-button (click)="exportCSV()" title="Export CSV" [disabled]="rows.length === 0">
      <mat-icon>download</mat-icon>
    </button>
  </div>

  <div class="grid-table-container" *ngIf="!loading">
    <table class="grid-table" *ngIf="columns.length > 0 && rows.length > 0">
      <thead>
        <tr>
          <th class="col-timestamp">Timestamp</th>
          <th *ngFor="let col of columns" class="col-value">
            {{ col.label }}
            <span class="col-units" *ngIf="col.engUnits">({{ col.engUnits }})</span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td class="col-timestamp">{{ row.formattedTime }}</td>
          <td *ngFor="let col of columns"
              class="col-value"
              [class]="getCellClass(row.values[col.key], col)">
            {{ formatValue(row.values[col.key]) }}
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="columns.length === 0" class="empty-state">
      <mat-icon>grid_on</mat-icon>
      <span>Select tags to display data</span>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <mat-spinner diameter="32"></mat-spinner>
    <span>Loading data...</span>
  </div>
</div>
