<div class="historian-trend-panel">
  <ng-container *ngIf="widgetTitlePanel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </ng-container>

  <div class="trend-toolbar">
    <button mat-icon-button (click)="toggleStats()" [title]="showStats ? 'Hide statistics' : 'Show statistics'">
      <mat-icon>{{ showStats ? 'assessment' : 'bar_chart' }}</mat-icon>
    </button>
    <button mat-icon-button (click)="exportCSV()" title="Export CSV">
      <mat-icon>download</mat-icon>
    </button>
  </div>

  <div class="trend-chart-area">
    <div #echartContainer class="trend-echart-container"></div>
  </div>

  <div *ngIf="showStats && stats.length > 0" class="trend-stats-bar">
    <table class="stats-table">
      <thead>
        <tr>
          <th>Tag</th>
          <th>TWA</th>
          <th>Min</th>
          <th>Max</th>
          <th>StdDev</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of stats">
          <td class="stat-label">{{ row.label }}</td>
          <td class="stat-value">{{ row.twa }}</td>
          <td class="stat-value">{{ row.min }}</td>
          <td class="stat-value">{{ row.max }}</td>
          <td class="stat-value">{{ row.stdDev }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
